# Every value can be overridden on the command line: -Dheadless=false -Dbrowser=firefox ...
# baseUrl is empty -> the demo app is started in-process on a random port. Set it to test a running instance.
baseUrl=
browser=chrome
headless=true
timeout.seconds=10
# false = brand-new browser per test (clean but slower); true = one browser per thread, state wiped between tests
browser.reuse=false
artifacts.dir=target/artifacts
