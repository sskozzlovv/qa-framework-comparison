# Parallel execution: test CLASSES run concurrently, methods of one class run sequentially.
# Maven turns it on via surefire configurationParameters (-Dtest.parallel=false to switch off, -Dtest.threads=N).
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=3
# Without max-pool-size the ForkJoin pool may start EXTRA threads while others block -> more browsers than planned
junit.jupiter.execution.parallel.config.fixed.max-pool-size=3
# A hanging test (e.g. waiting for a dialog that never comes) must not block the whole run
junit.jupiter.execution.timeout.default=2 m
# Allure: lets JUnit pick up the AllureJupiter extension from the allure-junit5 jar (META-INF/services), so
# @BeforeEach / @AfterEach show up in the report as set up / tear down. Test results themselves need no switch.
junit.jupiter.extensions.autodetection.enabled=true
