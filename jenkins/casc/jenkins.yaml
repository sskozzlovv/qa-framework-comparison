# Jenkins Configuration as Code (JCasC): everything you would otherwise click in the UI.
# Read on every start; after editing: Manage Jenkins -> Configuration as Code -> Reload existing configuration.
# JENKINS.md shows how to do each part by hand.

jenkins:
  systemMessage: "Local CI stand: Selenide + TestNG via Selenium Grid, Playwright TS. Configured from jenkins/casc/jenkins.yaml"
  # the controller only coordinates: 0 executors -> every build runs on an agent
  numExecutors: 0
  # LOCAL STAND ONLY: no login (ports are bound to 127.0.0.1)
  authorizationStrategy: unsecured

  nodes:
    - permanent:
        name: agent-1
        nodeDescription: "Docker container 'agent': JDK 21 + Maven wrapper, Node.js + Google Chrome"
        labelString: "maven playwright"     # jobs pick an agent by label: agent { label 'maven' }
        numExecutors: 2                     # 2 builds at the same time
        remoteFS: /home/jenkins/agent       # workspaces live here
        mode: NORMAL
        launcher:
          ssh:                              # the controller connects TO the agent and starts agent.jar there
            host: agent
            port: 22
            credentialsId: agent-ssh-key
            javaPath: /opt/java/openjdk/bin/java
            sshHostKeyVerificationStrategy: nonVerifyingKeyVerificationStrategy
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: agent-ssh-key
              username: jenkins
              description: "SSH key for agent-1 (generated by jenkins/up.sh)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/agent_key}"

unclassified:
  location:
    url: "http://localhost:8081/"

tool:
  allure:
    installations:
      # Allure 2.46.1 is installed in the agent image (jenkins/agent/Dockerfile). The plugin's auto-installer
      # ("Install automatically -> From Maven Central") offers only versions listed by the update center - see JENKINS.md.
      - name: allure
        home: /opt/allure

jobs:
  - script: |
      // Both jobs: "Pipeline script from SCM" - the job only says WHERE the Jenkinsfile is;
      // the pipeline itself (stages, agent, parameters, reports) lives in the repository.
      [
        ['selenide-testng', 'jenkins/Jenkinsfile.selenide-testng',
         'Selenide + TestNG: tests on agent-1, browsers in Selenium Grid. Allure + JUnit reports.'],
        ['playwright-ts', 'jenkins/Jenkinsfile.playwright-ts',
         'Playwright TS: tests AND browser on agent-1. Allure + Playwright HTML report (trace) + JUnit.'],
      ].each { name, path, text ->
        pipelineJob(name) {
          description(text)
          definition {
            cpsScm {
              scm {
                git {
                  remote { url('file:///repo.git') }   // the git repository of this computer, mounted read-only
                  branch('*/stage2')
                }
              }
              scriptPath(path)
              lightweight(true)
            }
          }
        }
      }
