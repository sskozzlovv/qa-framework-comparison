# Every value can be overridden on the command line: -Dheadless=false -Dbrowser=firefox ...
baseUrl=
# chromium | firefox | webkit
browser=chromium
# chromium only: "chrome" / "msedge" = use the browser INSTALLED on this machine (no ~150 MB download).
# Empty = Playwright's bundled Chromium (downloaded on the first run; firefox/webkit are always downloaded).
channel=chrome
headless=true
timeout.seconds=10
# record a video of every test (kept only for failed tests)
video=false
artifacts.dir=target/artifacts
