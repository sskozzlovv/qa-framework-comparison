<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Support</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body style="background:#fff;padding:10px">
<label for="message">Message to support</label><br>
<input id="message" style="width:60%">
<button id="send">Send</button>
<p id="sent" hidden>Thanks! We will reply soon.</p>
<script>
  document.getElementById('send').addEventListener('click', () => {
    if (!document.getElementById('message').value.trim()) return;
    setTimeout(() => document.getElementById('sent').hidden = false, 300);
  });
</script>
</body>
</html>
